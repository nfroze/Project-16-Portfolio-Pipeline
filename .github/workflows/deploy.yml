# .github/workflows/deploy.yml
name: Deploy Portfolio to AWS

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'Resume.pdf'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.webp'
      - 'images/**'
      - 'videos/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload files to S3
        run: |
          # Sync site files (excluding dev/build files)
          aws s3 sync . s3://noahfrost-devsecops/ \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "terraform/*" \
            --exclude "screenshots/*" \
            --exclude ".gitignore" \
            --exclude "README.md" \
            --delete

          # Ensure mp4 files have correct Content-Type for browser playback
          aws s3 cp s3://noahfrost-devsecops/videos/ s3://noahfrost-devsecops/videos/ \
            --recursive \
            --content-type "video/mp4" \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ERS9RIPIBIOR \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text

      - name: Display success message
        run: |
          echo "✅ Deployment complete!"
          echo "🌐 Site will be updated at https://noahfrost.co.uk in 2-5 minutes"